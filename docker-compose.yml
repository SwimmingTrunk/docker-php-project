services:

  php:
    build: .
    ports:
    - "8080:80"
    volumes:
    - ./src:/var/www/html
    depends_on:
    - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
     - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
    - db

